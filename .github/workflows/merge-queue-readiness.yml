name: Merge Queue Readiness

# The merge queue's required check.
#
# Ruleset `protected-branches` requires exactly one status check on main,
# `PR Readiness`, and the merge queue needs that same check reported on every
# merge group's temporary commit before it lands the group. pr-readiness.yml
# cannot report it there: it is keyed on a pull request number, and it folds
# in the AI review lanes, which do not run on a merge group and should not --
# a merge group is the PR's already-reviewed diff replayed onto the main it
# will actually land on, so the only question left is whether the tests still
# pass on THAT tree. This workflow answers that one question: it waits for
# every test workflow a push to main would run on the merge group's commit --
# CI, Fast Gate, Build, Internal Content Scan Gate, Python Client Tests and
# Main Ratchet Audit -- and reports their joint verdict under the required
# check's name. The list is the push-to-main set minus the two macOS legs
# (ci.yml's boot matrix and build.yml's desktop build), which stay on main's
# own post-merge run: a hosted mac runner has waited hours at this repository's
# merge rate, and a wait of that size inside the queue holds every group behind
# it.
#
# A SEPARATE FILE on purpose, triggered by nothing but `merge_group`. A job by
# this name inside ci.yml, even behind `if: github.event_name == 'merge_group'`,
# would still create a `PR Readiness` check run on every pull request head with
# conclusion `skipped` -- and GitHub treats a skipped required check as
# satisfied, so the pull-request gate would open for any head whose real
# readiness status had not been published yet. A workflow that never fires on
# pull_request creates no check run on a pull request head at all.
#
# Hosted runner, deliberately. This job polls; it runs no tests, so it does not
# need the fleet's size, and the fleet's webhook admits jobs by actor and
# workflow shape this file has no measured history with. The poll budget below
# starts when the job starts, so hosted runner queue time does not eat into it.
# The budget is the polled lanes' own ceiling, not their typical time: a CI run
# is ~25-30 minutes on the fleet, but ci.yml's longest `needs` chain of job
# caps is 100 minutes (changes and await-fast-gate in parallel 15 ->
# backend-test 60 -> coverage-combine 15 -> coverage-gate 10), so a shorter
# budget would dequeue a pull request whose lanes were about to go green.
# test_ci_fleet_routing_expression_parity.py holds the budget above that sum. Keep the ruleset's
# merge-queue "status check timeout" at 150 minutes or more: this budget plus a
# slow hosted pickup.
#
# Only a verdict fails the group. A run that concluded without success fails it
# at once; a run still absent after the appear window fails it because the
# verdict can never be read. A failed API read -- a rate limit, a 5xx, a reset,
# or a listing that has lost a run it showed a tick earlier -- is retried until
# the budget runs out, so one bad answer from the API cannot dequeue a green
# group.

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # One group per merge-group ref. A merge group is never superseded by a
  # newer revision of itself, so nothing here should ever cancel.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    # The job name IS the check name the ruleset requires. Renaming it silently
    # stops satisfying branch protection for every queued pull request.
    name: PR Readiness
    runs-on: ubuntu-latest
    # Above the poll's TOTAL_BUDGET below, so the step's own error names the
    # slow lane rather than the job cap cutting it off.
    timeout-minutes: 125
    permissions:
      # actions:read is what lets this read the other workflows' runs.
      # Job-level permissions REPLACE the top-level grant, so contents:read is
      # restated.
      actions: read
      contents: read
    steps:
      - name: Wait for every test workflow on this merge group
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # On a merge_group event github.sha IS the merge group's head commit
          # and github.ref_name is its `gh-readonly-queue/main/pr-N-<sha>` ref.
          # The polled workflows run on that same commit, and the runs API
          # reports that ref as each run's `head_branch` (observed on public
          # repositories that use the queue: `head_branch` of a merge_group run
          # is `gh-readonly-queue/<base>/pr-<n>-<sha>`), which is what the
          # `branch=` filter below and the `head_branch` re-check match on.
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOWS: ci.yml fast-gate.yml build.yml internal-content-scan-gate.yml client-py.yml main-ratchet-audit.yml
        run: |
          set -uo pipefail

          # Every polled workflow starts from the same webhook, so their runs
          # may not be visible for the first seconds. APPEAR_BUDGET covers that
          # race; after it, a run the API lists as absent is a real
          # misconfiguration and fails.
          # TOTAL_BUDGET is 120 minutes: ci.yml's 100-minute longest chain of
          # job caps (changes | await-fast-gate 15 -> backend-test 60 ->
          # coverage-combine 15 -> coverage-gate 10) plus slack for the shards'
          # own pickup. The ruleset's merge-queue status-check timeout has to
          # stay at 150 minutes or more so that this budget plus a slow hosted
          # pickup fits inside it.
          APPEAR_BUDGET=300
          TOTAL_BUDGET=7200
          started="$(date +%s)"

          read -r -a workflows <<<"$WORKFLOWS"

          errfile="$(mktemp)"
          trap 'rm -f "$errfile"' EXIT

          # Prints one JSON line: workflow $1's latest run for this commit on
          # this ref, or `null` when the listing holds none. Returns non-zero
          # when the API call or its parsing failed, with the error's head in
          # $errfile, so the caller can tell "there is no run" from "the run
          # could not be read" -- the two must not share a verdict.
          latest_run() {
            local listing
            if ! listing="$(gh api --method GET "repos/$REPO/actions/workflows/$1/runs" \
                  -f "head_sha=$SHA" -f "event=merge_group" -f "branch=$BRANCH" \
                  -f per_page=100 2>"$errfile")"; then
              return 1
            fi
            if ! printf '%s' "$listing" | jq -c --arg branch "$BRANCH" \
                  '[(.workflow_runs // [])[] | select(.head_branch == $branch)]
                   | if length == 0 then null else max_by(.id) end' \
                  2>"$errfile"; then
              return 1
            fi
          }

          api_error() {
            head -c 200 "$errfile" | tr '\n' ' '
          }

          # Workflows whose run has been listed, as `wf=run_id` words, and how
          # many there are. A run cannot vanish from the API, so an empty
          # listing for a workflow here is a bad answer, not an absent run.
          # A plain string rather than an associative array, and the array
          # expansions below guarded with `${a[@]+"${a[@]}"}`: the repository's
          # workflow scripts must also run under bash 3.2 (see
          # test_workflow_array_expansion_bash32.py).
          seen_runs=""
          seen_count=0

          seen_run_id() {
            local word
            # shellcheck disable=SC2086 -- deliberate word split of the list.
            for word in $seen_runs; do
              case "$word" in "$1="*) printf '%s' "${word#*=}"; return 0 ;; esac
            done
            return 1
          }

          while :; do
            elapsed=$(( $(date +%s) - started ))
            done_list=""
            pending=""
            missing=""
            errored=""

            for wf in ${workflows[@]+"${workflows[@]}"}; do
              if ! latest="$(latest_run "$wf")"; then
                echo "::warning::$wf: could not read its runs on $SHA:" \
                     "$(api_error). Retrying on the next tick."
                errored="$errored $wf"
                continue
              fi
              if [ "$latest" = "null" ] || [ -z "$latest" ]; then
                if seen_id="$(seen_run_id "$wf")"; then
                  echo "::warning::$wf: run $seen_id was listed earlier" \
                       "but this listing holds no run for $SHA. Treating the" \
                       "answer as an API error and retrying."
                  errored="$errored $wf"
                else
                  missing="$missing $wf"
                fi
                continue
              fi
              run_id="$(printf '%s' "$latest" | jq -r '.id')"
              status="$(printf '%s' "$latest" | jq -r '.status')"
              conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
              url="$(printf '%s' "$latest" | jq -r '.html_url')"
              if ! seen_run_id "$wf" >/dev/null; then
                seen_runs="$seen_runs $wf=$run_id"
                seen_count=$((seen_count + 1))
              fi
              if [ "$status" != "completed" ]; then
                pending="$pending $wf($status)"
                continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "::error::$wf concluded '$conclusion' on merge group $SHA ($url)." \
                     "The group is not cleared to merge."
                exit 1
              fi
              done_list="$done_list $wf"
            done

            if [ -n "$missing" ] && [ "$elapsed" -ge "$APPEAR_BUDGET" ]; then
              echo "::error::No merge_group run found for$missing on $SHA ($BRANCH)" \
                   "after ${elapsed}s. The verdict cannot be read, so the group is" \
                   "not cleared to merge."
              exit 1
            fi

            if [ -z "$missing" ] && [ -z "$pending" ] && [ -z "$errored" ] \
               && [ "$seen_count" -eq "${#workflows[@]}" ]; then
              echo "Every polled workflow succeeded on $SHA. Clearing the group."
              exit 0
            fi

            if [ "$elapsed" -ge "$TOTAL_BUDGET" ]; then
              echo "::error::Still waiting on${missing}${pending}${errored} after" \
                   "${elapsed}s. Failing closed rather than clearing the group" \
                   "unverified."
              exit 1
            fi

            echo "t+${elapsed}s: done:${done_list:- -} pending:${pending:- -}" \
                 "missing:${missing:- -} errored:${errored:- -}"

            # Poll fast only while a run may still be appearing; once every
            # workflow has a run, a completion is minutes away at best and a
            # slower tick spares the API budget that the read itself depends on.
            if [ "$seen_count" -eq "${#workflows[@]}" ]; then
              sleep 120
            else
              sleep 30
            fi
          done
